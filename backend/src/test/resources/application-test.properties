spring.datasource.url=jdbc:h2:mem:dopapc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# shortcut: H2 no reproduce el locking de Postgres; migrar a Testcontainers cuando haya Docker en CI.
spring.flyway.enabled=false

jwt.secret=test_secret_at_least_32_bytes_long_1234567890
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

minio.endpoint=http://localhost:9000
minio.access-key=test
minio.secret-key=test
minio.bucket-products=test

admin.import-token=test
app.admin.import.enabled=false

shipment.check-interval-ms=3600000
